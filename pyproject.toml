[project]
name = "pcap-analyzer"
version = "0.1.0"
description = "Automatic pcap files analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.6.1",
]

[project.scripts]
pcap-analyzer = "pcap_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
